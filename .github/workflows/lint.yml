name: Lint

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    # Runs automatically in upstream and in this fork (pablotp/manyfold); other forks can start it manually (Actions tab -> Run workflow)
    if: (github.repository == 'manyfold3d/manyfold' || github.repository == 'pablotp/manyfold' || github.event_name == 'workflow_dispatch') && github.triggering_actor != 'allcontributors[bot]'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint Ruby code
        run: bundle exec rake rubocop
      - name: Lint ERB templates
        run: bundle exec erb_lint --lint-all
      - name: Lint Typescript code
        run: yarn run lint
      - name: Check typescript
        run: yarn typecheck
