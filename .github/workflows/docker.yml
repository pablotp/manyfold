name: Docker

# Builds the Manyfold images for this fork and publishes them to:
#   - Docker Hub:  <DOCKERHUB_USERNAME>/<variant>   (only if the DOCKERHUB_USERNAME variable is set)
#   - GHCR:        ghcr.io/<repository owner>/<variant>  (always, using the built-in GITHUB_TOKEN)
#
# One-time setup (repository Settings -> Secrets and variables -> Actions):
#   Variables: DOCKERHUB_USERNAME  your Docker Hub username (also used as the image namespace)
#              DOCKER_PLATFORMS    optional, e.g. "linux/amd64,linux/arm64" (default: linux/amd64)
#                                  arm64 is built under emulation and is very slow (it hung on
#                                  "yarn install" for over an hour); it will hit the job timeout.
#   Secrets:   DOCKERHUB_TOKEN     a Docker Hub personal access token with Read & Write scope
#
# Tags produced: "latest" and "edge" for the default branch, "sha-<commit>" for every build,
# "<version>" for v* git tags, and a custom tag for manual runs.
# Pull requests are not built, to save CI time (add a pull_request trigger to re-enable).

on:
  push:
    branches: [ "main" ]
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag for build results'
        type: string
        default: manual
        required: true
      push:
        description: 'Push the images (untick to only test that the build works)'
        type: boolean
        default: true

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  PUSH: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
  PLATFORMS: ${{ vars.DOCKER_PLATFORMS || 'linux/amd64' }}

jobs:
  build:
    if: github.triggering_actor != 'allcontributors[bot]'
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        # Only the standard image (external Postgres/MySQL + Redis) is built for this fork.
        # Add "- manyfold-solo" (built-in Redis + SQLite) back here if you need it.
        variant:
          - manyfold
    runs-on: ubuntu-latest
    # An amd64 image normally builds in ~6-10 minutes; stop runaway builds
    # (e.g. hung emulated arm64 steps) instead of burning runner time.
    timeout-minutes: 30
    permissions:
      contents: read # for checkout
      packages: write # to upload build to GHCR
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Work out image names
        id: names
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          OWNER: ${{ github.repository_owner }}
          VARIANT: ${{ matrix.variant }}
        run: |
          # GHCR image names must be lowercase
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          {
            echo "images<<EOF"
            echo "ghcr.io/${owner}/${VARIANT}"
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "docker.io/${DOCKERHUB_USERNAME}/${VARIANT}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Work out Docker tags
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=raw,value=${{ inputs.tag }},event=workflow_dispatch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=pr
            type=sha,format=long
            type=edge

      - name: Set up QEMU (for non-amd64 platforms)
        if: env.PLATFORMS != 'linux/amd64'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.PUSH == 'true' && vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/${{ matrix.variant }}.dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          build-args: |
            APP_VERSION=${{ steps.docker_meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            DOCKER_TAG=${{ steps.docker_meta.outputs.tags }}

  smoke-test:
    if: github.triggering_actor != 'allcontributors[bot]' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read # to pull the freshly built image from GHCR
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same layout as a typical docker compose deployment: Postgres + Redis + Manyfold
      - name: Start Postgres and Redis
        run: |
          docker network create manyfold
          docker run -d --name postgres --network manyfold \
            -e POSTGRES_USER=manyfold -e POSTGRES_PASSWORD=password -e POSTGRES_DB=manyfold \
            postgres:17
          docker run -d --name redis --network manyfold redis:7
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U manyfold -d manyfold && docker exec redis redis-cli ping && exit 0
            sleep 2
          done
          echo "Postgres/Redis did not become ready"; exit 1

      - name: Start Manyfold
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          docker run -d --name manyfold --network manyfold -p 3214:3214 \
            -e SECRET_KEY_BASE=abc123 \
            -e REDIS_URL=redis://redis:6379/1 \
            -e DATABASE_ADAPTER=postgresql -e DATABASE_HOST=postgres -e DATABASE_PORT=5432 \
            -e DATABASE_USER=manyfold -e DATABASE_PASSWORD=password -e DATABASE_NAME=manyfold \
            "ghcr.io/${owner}/manyfold:sha-${SHA}"

      - name: Smoke test
        run: |
          # Wait up to 5 minutes for migrations and app boot
          for i in $(seq 1 60); do
            if curl --silent --fail-with-body http://localhost:3214/health; then
              echo; echo "Manyfold is healthy"; exit 0
            fi
            sleep 5
          done
          echo "Manyfold did not become healthy"; exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs manyfold 2>&1 | tail -200
