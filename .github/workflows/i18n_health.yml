name: Check translations

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  i18n:
    # In forks, only run when started manually (Actions tab -> Run workflow) to save CI time
    if: (github.repository == 'manyfold3d/manyfold' || github.event_name == 'workflow_dispatch') && github.triggering_actor != 'allcontributors[bot]'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check translations
        run: bundle exec i18n-tasks health -l en
